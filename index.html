<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobEngine</title>
<style>
:root{--ink:#17231f;--paper:#f4f1e8;--card:#fffdf8;--coral:#ff765f;--lime:#c8ed64;--muted:#66736d;--line:#d7ddd0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}body:before{content:'';display:block;height:9px;background:var(--ink)}main{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px;font-weight:bold}.status{font:12px Arial;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.dot{display:inline-block;width:8px;height:8px;background:#65b85b;border-radius:50%;margin-right:7px}h1{font-size:clamp(48px,8vw,82px);line-height:.92;font-weight:normal;margin:70px 0 50px;letter-spacing:-.04em}h1 em{color:var(--coral);font-style:normal}.filters{background:var(--ink);padding:20px;display:flex;gap:12px;flex-wrap:wrap}input,select,button{border:0;padding:14px 16px;font:15px Arial}input{flex:1;min-width:220px;background:#26352f;color:#fff}select{background:#26352f;color:#fff}button{background:var(--lime);font-weight:bold;cursor:pointer}.heading{display:flex;justify-content:space-between;align-items:center;padding:36px 0 16px}.heading h2{font-weight:normal}.heading span{font:13px Arial;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.job{background:var(--card);border:1px solid var(--line);padding:24px;min-height:180px}.top{display:flex;justify-content:space-between;gap:15px}.job h3{font-size:24px;font-weight:normal;margin:0}.salary{color:var(--coral);font:bold 15px Arial}.meta{display:flex;gap:20px;color:var(--muted);font:13px Arial;margin-top:35px}.empty{grid-column:1/-1;border:1px dashed var(--line;padding:40px;text-align:center;font:15px Arial;color:var(--muted)}@media(max-width:650px){main{padding:18px}.grid{grid-template-columns:1fr}h1{margin:55px 0 35px}.filters>*{width:100%}}
</style></head>
<body><main><header><div>job<span style="color:var(--coral)">engine</span></div><div class="status"><i class="dot"></i>live</div></header><h1>Good work is<br><em>out there.</em></h1><section class="filters"><input id="search" placeholder="Search role, company or city"><select id="experience"><option value="0">All experience levels</option></select><button id="refresh">Refresh roles</button><button onclick="location.href='/subscribe'">Subscribe R99</button></section><section class="heading"><h2>Open roles</h2><span id="count">Loading...</span></section><section id="jobs" class="grid"></section></main>
<script>const fallback=[{title:'Junior Java Developer',company:'Entelect',location:'Melrose Arch',salary:25000},{title:'Web Assistant (Frontend)',company:'Adcorp Group',location:'Sandton',salary:22000},{title:'IT Systems Intern',company:'Hire Resolve',location:'Bryanston',salary:18000},{title:'Software Support Tech',company:'Private Security Hub',location:'Midrand',salary:24000}];const list=document.querySelector('#jobs'),search=document.querySelector('#search'),count=document.querySelector('#count');let jobs=[];function render(){let q=search.value.toLowerCase(),shown=jobs.filter(j=>(j.title+' '+j.company+' '+j.location).toLowerCase().includes(q));count.textContent=shown.length+' role'+(shown.length===1?'':'s')+' found';list.innerHTML=shown.length?shown.map(j=>`<article class="job"><div class="top"><h3>${j.title}</h3><span class="salary">R${j.salary.toLocaleString()}</span></div><div class="meta"><span>${j.company}</span><span>${j.location}</span></div></article>`).join(''):'<div class="empty">No roles match your search.</div>'}async function load(){try{let r=await fetch('/jobs');if(!r.ok)throw new Error('static host');jobs=await r.json()}catch(e){jobs=fallback}render()}search.oninput=render;document.querySelector('#refresh').onclick=load;load()</script></body></html>
